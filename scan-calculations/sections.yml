  - worldpop          # Population Data, Distribution
  - demographics      # Age-Sex Distribution, Demographic Indicators
  - oxford            # Benchmark Cities, GDP, Employment, Inequality
  - rwi               # Relative Wealth Index
  - wsf               # Urban Built-up Area, Tracker, Harmonized
  - landcover         # Landcover
  - elevation         # Elevation
  - slope             # Slope
  - fathom            # Fluvial, Pluvial, Coastal, Combined Flooding
  - gdp_sectoral      # GDP by Sector
  - flood_events      # Flood Events (Dartmouth)
  - earthquake        # Earthquakes (NGDC)
  - cyclones          # Cyclones (IBTrACS)
  # - lst               # Land Surface Temperature
  - solar             # Photovoltaic Potential
  - fwi               # Fire Weather Index
